name: keyboard_guard
description: Native keyboard filtering and unlock recognition for Keyboard Saver.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: KeyboardGuardPlugin
      windows:
        pluginClass: KeyboardGuardPluginCApi
