name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, matching pubspec.yaml (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit(f'Expected a version tag such as v0.1.0: {tag}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: Check app version
        id: version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          match = re.search(r'^version:\s*([0-9A-Za-z.-]+)\+\d+\s*$', Path('pubspec.yaml').read_text(), re.MULTILINE)
          if match is None:
              raise SystemExit('pubspec.yaml must contain a version and build number.')
          version = match.group(1)
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Tag does not match app version {version}.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'prerelease={str("-" in version).lower()}\n')
          PY

  build:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.prepare.outputs.tag }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          pattern: keyboard-saver-*
          path: dist
          merge-multiple: true
      - name: Verify release files
        working-directory: dist
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          archives = sorted(Path('.').glob('*.zip'))
          macos = list(Path('.').glob(f'keyboard-saver-{version}-macos-*.zip'))
          windows = Path(f'keyboard-saver-{version}-windows-x64.zip')
          if len(archives) != 2 or len(macos) != 1 or not windows.is_file():
              raise SystemExit(f'Expected one Mac and one Windows ZIP for {version}: {archives}')
          for archive in archives:
              if not Path(str(archive) + '.sha256').is_file():
                  raise SystemExit(f'Missing checksum for {archive}')
          PY
          sha256sum --check ./*.sha256
      - name: Create or update draft release
        env:
          RELEASE_NOTES: |
            Keyboard Saver 무료 테스트 버전입니다.

            다운로드 파일
            - Mac: 이름에 macos가 포함된 ZIP. universal은 Apple Silicon과 Intel Mac 공용입니다.
            - Windows: 이름에 windows-x64가 포함된 ZIP. 폴더 전체를 압축 해제한 뒤 keyboard_saver.exe를 실행하세요.
            - 각 ZIP의 설치 안내는 README.txt에 포함되어 있습니다.

            설치 전 확인
            - Mac은 Apple 공증을 받지 않은 ad hoc 서명 버전으로, 실행 시 보안 경고와 손쉬운 사용 권한 허용 절차가 나타날 수 있습니다.
            - Windows는 배포용 코드 서명이 없는 버전으로, 보안 경고가 나타날 수 있습니다.
            - 청소가 끝나면 키보드에서 손을 뗀 뒤 마우스로 '청소 끝내기'를 누르세요. 자동 종료는 없습니다.
            - 전원·Touch ID·보안 입력·Ctrl+Alt+Delete와 제조사별 밝기 키는 차단을 보장하지 않습니다.

            버그 제보는 저장소의 Issues를 이용해주세요.
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.txt
          if existing_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$existing_draft" != true ]]; then
              printf 'Release %s is already published; use a new version tag.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --draft --prerelease="$PRERELEASE" \
              --title "Keyboard Saver $RELEASE_TAG" --notes-file release-notes.txt
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
              --verify-tag --draft --prerelease="$PRERELEASE" \
              --title "Keyboard Saver $RELEASE_TAG" --notes-file release-notes.txt
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
