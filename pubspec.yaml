name: keyboard_saver
description: A desktop keyboard cleaning utility for macOS and Windows.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  keyboard_guard:
    path: packages/keyboard_guard

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/foam-keycap/k-keycap-fill.png
    - assets/images/foam-keycap/k-keycap-outline.png
    - assets/images/wordmark/keyboard-saver-title-bold.png
    - assets/images/wordmark/keyboard-saver-title-semibold.png
  config:
    enable-swift-package-manager: true
